<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="appwrite_user_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Food User</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Initial loading screen (shown until Flutter renders its first frame) ── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F5F7FA;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #F5F7FA 0%, #F5F7FA 52%, #F5F7FA 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    /* Soft glowing blobs for depth */
    #app-loader::before,
    #app-loader::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.18;
      background: #ffffff;
    }
    #app-loader::before {
      width: 320px;
      height: 320px;
      top: -110px;
      right: -90px;
    }
    #app-loader::after {
      width: 260px;
      height: 260px;
      bottom: -100px;
      left: -80px;
      opacity: 0.12;
    }

    #app-loader.app-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader__logo {
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      animation: loaderPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .loader__logo img {
      width: 78px;
      height: 78px;
      object-fit: contain;
    }

    .loader__name {
      margin-top: 24px;
      color: #ffffff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.3px;
      animation: loaderFadeUp 0.6s ease 0.1s both;
    }

    .loader__tagline {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 400;
      animation: loaderFadeUp 0.6s ease 0.2s both;
    }

    .loader__spinner {
      margin-top: 38px;
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(255, 255, 255, 0.28);
      border-top-color: #0B1220;
      border-radius: 50%;
      animation: loaderSpin 0.85s linear infinite;
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes loaderPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes loaderFadeUp {
      0% { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader__logo,
      .loader__name,
      .loader__tagline { animation: none; }
      .loader__spinner { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>
  <!-- Branded loading screen shown while the Flutter engine boots. -->
  <div id="app-loader">
    <div class="loader__logo">
      <img src="icons/Icon-192.png" alt="Food User" />
    </div>
    <div class="loader__name">Food User</div>
    <div class="loader__tagline">Getting things ready…</div>
    <div class="loader__spinner"></div>
  </div>

  <script>
    // Fade out and remove the loader once Flutter paints its first frame.
    (function () {
      function dismissLoader() {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.classList.add('app-loader--hidden');
        window.setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 550);
      }
      window.addEventListener('flutter-first-frame', dismissLoader);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
