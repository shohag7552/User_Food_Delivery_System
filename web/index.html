<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Kiko Mart — browse, order and get it delivered.">

  <!-- Release stamp — the ONE place the version is written.
       `tool/build_web.sh` syncs it from pubspec.yaml and then builds, so a
       release cannot ship pointing at the previous build's assets. The script
       below reads this and appends it to the bootstrap URL, which is what
       makes a browser holding yesterday's copy go and fetch today's. -->
  <meta name="app-version" content="1.0.0+1">

  <!-- Browser UI colour follows the system theme. -->
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kiko Mart">
  <!-- iOS ignores the manifest and takes the home-screen icon from here.
       Same single source as everything else, so replacing icons/logo.png is
       the whole rebrand. -->
  <link rel="apple-touch-icon" href="icons/logo.png">

  <!-- Favicon. The same file again on purpose: the loading screen below
       already fetches it, so pointing the tab icon at a second image would
       cost an extra download to show the same mark. -->
  <link rel="icon" type="image/png" href="icons/logo.png"/>

  <title>Kiko Mart</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ──────────────────────────────────────────────────────────────
       Initial loading screen (shown until Flutter renders its first
       frame). Theme tokens mirror the app's palette in colors.dart so
       the boot screen matches the app in both light and dark mode.
       ────────────────────────────────────────────────────────────── */
    :root {
      --bg-1: #F5F7FA;
      --bg-2: #EDF1F7;
      --card: #FFFFFF;
      --card-border: rgba(16, 24, 40, 0.06);
      --card-shadow: rgba(16, 24, 40, 0.14);
      --text: #1A1A1A;
      --muted: #6B7280;
      --brand: #E03131;
      --brand-strong: #C92A2A;
      --ring-track: rgba(224, 49, 49, 0.16);
      --blob: rgba(224, 49, 49, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #0B1220;
        --bg-2: #111A2E;
        --card: #111827;
        --card-border: rgba(255, 255, 255, 0.08);
        --card-shadow: rgba(0, 0, 0, 0.55);
        --text: #F8FAFC;
        --muted: #CBD5E1;
        --brand: #F03E3E;
        --brand-strong: #E03131;
        --ring-track: rgba(240, 62, 62, 0.20);
        --blob: rgba(240, 62, 62, 0.14);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg-1);
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    /* Soft brand-tinted glows for depth. */
    #app-loader::before,
    #app-loader::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      background: var(--blob);
      pointer-events: none;
    }
    #app-loader::before {
      width: 340px;
      height: 340px;
      top: -120px;
      right: -90px;
    }
    #app-loader::after {
      width: 300px;
      height: 300px;
      bottom: -120px;
      left: -90px;
      opacity: 0.8;
    }

    #app-loader.app-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader__card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    .loader__logo {
      width: 108px;
      height: 108px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 20px 55px -12px var(--card-shadow);
      animation: loaderPop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .loader__logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .loader__name {
      margin-top: 26px;
      color: var(--text);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.2px;
      animation: loaderFadeUp 0.6s ease 0.1s both;
    }

    .loader__tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.2px;
      animation: loaderFadeUp 0.6s ease 0.2s both;
    }

    /* Modern gradient ring spinner (masked conic gradient). */
    .loader__spinner {
      margin-top: 40px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, transparent 8%, var(--brand) 92%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side,
        transparent calc(100% - 4px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side,
        transparent calc(100% - 4px), #000 calc(100% - 4px));
      animation: loaderSpin 0.85s linear infinite;
      animation-delay: 0.15s;
    }
    /* Fallback for browsers without mask support: a bordered ring. */
    @supports not ((-webkit-mask: radial-gradient(#000, #000)) or (mask: radial-gradient(#000, #000))) {
      .loader__spinner {
        background: none;
        border: 3.5px solid var(--ring-track);
        border-top-color: var(--brand);
      }
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes loaderPop {
      0% { transform: scale(0.72); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes loaderFadeUp {
      0% { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader__logo,
      .loader__name,
      .loader__tagline { animation: none; }
      .loader__spinner { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>
  <!-- Branded loading screen shown while the Flutter engine boots. -->
  <div id="app-loader">
    <div class="loader__card">
      <div class="loader__logo">
        <img src="icons/logo.png" alt="Kiko Mart" />
      </div>
      <div class="loader__name">Kiko Mart</div>
      <div class="loader__tagline">Getting things ready…</div>
      <div class="loader__spinner"></div>
    </div>
  </div>

  <script>
    // Fade out and remove the loader once Flutter paints its first frame.
    (function () {
      function dismissLoader() {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.classList.add('app-loader--hidden');
        window.setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 550);
      }
      window.addEventListener('flutter-first-frame', dismissLoader);
    })();
  </script>

  <script>
    // Loads the Flutter bootstrap at a URL that changes with every release.
    //
    // Flutter's service worker is now a stub that unregisters itself, so it
    // caches nothing: HTTP caching is the only thing deciding whether a
    // returning visitor runs the new build or the old one. Every generated
    // file keeps the same name from release to release, so a cached copy is
    // indistinguishable from a current one by URL alone — the version query is
    // what tells them apart.
    //
    // Injected rather than written as a static <script src>: it keeps the
    // version in exactly one place (the meta tag above) instead of two that
    // can drift apart. A dynamically created script is async by default, so
    // this loads exactly as the static tag did.
    (function () {
      var meta = document.querySelector('meta[name="app-version"]');
      var version = (meta && meta.content) || '';
      // Readable from the console and from Dart via dart:js_interop, so
      // "which build is this?" has an answer that does not need a rebuild.
      window.APP_VERSION = version;

      var script = document.createElement('script');
      // Falls back to the plain URL if the stamp is ever missing: a missing
      // version should cost freshness, never the whole app.
      script.src = version
        ? 'flutter_bootstrap.js?v=' + encodeURIComponent(version)
        : 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
